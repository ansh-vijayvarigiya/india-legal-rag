name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Runs the evaluation CLI against the committed snapshots, so the smoke
      # test covers the whole pipeline and not just the units.
      - run: python -m pytest -m "not slow"
