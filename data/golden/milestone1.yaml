# Retrieval golden set, milestone 1.
#
# A YAML list of mappings. Every reported retrieval number is computed against
# this file, so a wrong label invalidates the report rather than the code.
#
#   qid                 unique id, for example q001
#   question            the question as a user would type it
#   relevant_chunk_ids  chunk ids that contain the answer; [] when unanswerable
#   category            one of: single_clause, multi_clause, cross_document,
#                       temporal, unanswerable
#   answerable          true when the corpus can answer it
#   gold_answer         reference answer; omitted for unanswerable questions
#
# Generated with language-model assistance against the ingested corpus, then
# checked so that each labelled chunk demonstrably contains the answer. See
# README.md in this directory for the annotation rules.
#
# Corpus: 25 RBI notifications captured on 2026-10-18, 154 chunks.

# --- single_clause: the answer is in one chunk -----------------------------

- qid: q001
  question: What is the minimum proportion of the required cash reserve ratio that scheduled banks must maintain on all days of the reporting fortnight?
  relevant_chunk_ids: ["rbi:13736#0000"]
  category: single_clause
  answerable: true
  gold_answer: Not less than 90 per cent of the required CRR.

- qid: q002
  question: What is the revised Bank Rate announced in the Monetary Policy Statement of October 07, 2026, and by how much was it raised?
  relevant_chunk_ids: ["rbi:13728#0000"]
  category: single_clause
  answerable: true
  gold_answer: Revised upwards by 25 basis points from 5.50 per cent to 5.75 per cent, with immediate effect.

