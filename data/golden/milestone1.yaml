# --- multi_clause: two chunks of the same document are both needed ---------

- qid: q011
  question: When must a repaired note be sorted as suspect or reject, and by what date must note sorting machines that have been discontinued from production be phased out?
  relevant_chunk_ids: ["rbi:13723#0005", "rbi:13723#0006"]
  category: multi_clause
  answerable: true
  gold_answer: Repairs covering an area greater than 100 mm2, or where the extraneous matter is 50 micrometres or more thick or 10 mm or more wide or long; and discontinued NSM models must be phased out on or before June 30, 2027.

- qid: q012
  question: What monitoring arrangement must a bank's Head Office put in place for the flow of credit to SC/ST beneficiaries, and how must advances to SCs and STs be reported?
  relevant_chunk_ids: ["rbi:13716#0004", "rbi:13716#0005"]
  category: multi_clause
  answerable: true
  gold_answer: A special cell at the Head Office to monitor credit flow, collect and consolidate data from branches and submit returns to the Reserve Bank and the Government; and advances are to be reported as prescribed in the Master Direction on Priority Sector Lending within the stipulated time frames.

- qid: q013
  question: In the Commercial Banks Prudential Norms on Capital Adequacy (Twelfth Amendment) Directions, 2026, which two paragraphs of the 2025 Directions were amended, and what does the amended text say an incurred CVA loss is based on?
  relevant_chunk_ids: ["rbi:13732#0000", "rbi:13732#0001"]
  category: multi_clause
  answerable: true
  gold_answer: Paragraph 85(6)(i) on the requirement for clearing member banks to obtain legal opinion, and paragraph 213(2)(iv)(b); the CVA loss is the CVA recognised by the bank as an incurred write-down, taken from the amount recognised in its financial statements.

- qid: q014
  question: Under the October 10, 2026 Risk Management and Inter-Bank Dealings circular, what restriction applies to rebooking a cancelled foreign exchange derivative contract involving INR, and what must an Authorised Dealer obtain when offering such a contract to hedge a contracted exposure?
  relevant_chunk_ids: ["rbi:13737#0000", "rbi:13737#0001"]
  category: multi_clause
  answerable: true
  gold_answer: An Authorised Dealer shall not permit users to rebook any cancelled foreign exchange derivative contract involving INR; and must obtain and retain an undertaking from the user that the same underlying exposure has not been hedged with any other Authorised Dealer.

# --- cross_document: the answer spans more than one document ---------------

- qid: q015
  question: Following the Monetary Policy Statement of October 07, 2026, what changes were announced to the policy repo rate under the LAF, to the Bank Rate, and to the Standing Liquidity Facility for Primary Dealers?
  relevant_chunk_ids: ["rbi:13726#0000", "rbi:13727#0000", "rbi:13728#0000"]
  category: cross_document
  answerable: true
  gold_answer: The policy repo rate under the LAF was increased by 25 basis points from 5.25 per cent to 5.50 per cent; the Bank Rate was revised upwards by 25 basis points from 5.50 per cent to 5.75 per cent; and the Standing Liquidity Facility for Primary Dealers was revised accordingly.

- qid: q016
  question: Which amendment directions issued on October 07, 2026 change the requirement for clearing member banks or financial institutions to obtain a legal opinion, and which categories of entities do they cover?
  relevant_chunk_ids: ["rbi:13732#0000", "rbi:13733#0000", "rbi:13734#0000", "rbi:13735#0000"]
  category: cross_document
  answerable: true
  gold_answer: Commercial banks (Twelfth Amendment, paragraph 85(6)(i)), Small Finance Banks (Sixth Amendment, paragraph 75(5)(i)), Payments Banks (Third Amendment, paragraph 52(5)(i)) and All India Financial Institutions (Fifth Amendment, paragraph 77(6)(i)).

