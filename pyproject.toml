[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "0.1.0"
description = "Evaluation-first retrieval over Indian regulatory text"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "numpy>=1.26",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "streamlit>=1.36",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that download models or take more than a few seconds",
]
